{% extends 'layout.html' %}

{% block title %}
Register - Tunes Library
{% endblock %}

{% block style %}
{% endblock %}

{% block content %}
<div class="register-container">
    <h1>Register for Tunes Library</h1>
    <br>
    <form method="post">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required minlength="4" maxlength="20">
        <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required minlength="4">
        <br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" name="confirm_password" id="confirm_password" required minlength="4">
        <input type="hidden" name="role" value="User">
        <input type="submit" value="Register">
    </form>
</div>
{% endblock %}
