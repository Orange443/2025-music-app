<!-- admin_login.html -->
{% extends 'layout.html' %}

{% block title %}
Admin Login - Tunes Library
{% endblock %}


{% block content %}
<div class="admin-login-container">
    <h1>Admin Login</h1>
    <br>
    <form method="post">
        <label for="username">Admin Username:</label>
        <input type="text" name="username" id="username" required minlength="4" maxlength="20">
        <br>
        <label for="password">Admin Password:</label>
        <input type="password" name="password" id="password" required minlength="4">
        <br>
        <br>
        <input type="submit" value="Login as Admin">
    </form>
</div>
{% endblock %}


{% block style %}
{% endblock %}
