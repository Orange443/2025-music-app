{% extends 'layout.html' %}

{% block title %}
    Delete Album 
{% endblock %}

{% block style %}
{% endblock %}

{% block content %}
<div class="delete-container">
    <h1>Delete Album</h1>
    <hr>
    <h5 class="text-center text-danger">Are you sure you want to delete this
        <strong>Album</strong>?
    </h5>
    <form method="post" class="form">
        <button type="submit" class="delete-button">
            <i class="fas fa-trash bin-icon"></i>
            Delete
        </button>
    </form>
</div>
{% endblock %}
