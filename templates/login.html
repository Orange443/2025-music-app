<!-- login.html -->
{% extends 'layout.html' %}


{% block title %}
Login - Tunes Library
{% endblock %}

{% block style %}
{% endblock %}

{% block content %}
<div class="login-container">
    <h1>Login to Tunes Library</h1>
    <br>
    <form method="post">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required minlength="4" maxlength="20">
        <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required minlength="4">
        <br>
        <input type="submit" value="Login">
        <br><br>
        <p>Click <a href="{{ url_for('admin_login') }}">here</a> to login as an admin.</p>
    </form>
</div>
{% endblock %}
